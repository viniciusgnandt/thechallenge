name: Mobile Build (EAS)

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        default: 'all'
        type: choice
        options: [all, android, ios]
      profile:
        description: 'Build profile'
        required: true
        default: 'preview'
        type: choice
        options: [development, preview, production]

jobs:
  build:
    name: EAS Build
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        working-directory: mobile
        run: npm ci --legacy-peer-deps

      - name: Install eas-cli
        run: npm install -g eas-cli

      - name: Build (push trigger)
        if: github.event_name == 'push'
        working-directory: mobile
        # Só Android por enquanto — build de iOS não-interativo exige credenciais
        # da Apple (Apple ID, App Store Connect App ID, Team ID) ainda não configuradas.
        run: eas build --platform android --profile preview --non-interactive

      - name: Build (manual trigger)
        if: github.event_name == 'workflow_dispatch'
        working-directory: mobile
        run: eas build --platform ${{ github.event.inputs.platform }} --profile ${{ github.event.inputs.profile }} --non-interactive
